<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>סוחר הים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap');
      
      body {
        background-color: #f3f4f6; /* gray-100 */
        color: #1f2937; /* gray-800 */
        font-family: 'Heebo', system-ui, sans-serif;
        overflow: hidden; /* Prevent body scroll, handle in app */
      }
      
      /* Modern Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }

      /* Sailing Animations */
      @keyframes float-ship {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-4px) rotate(-2deg); }
        75% { transform: translateY(4px) rotate(1deg); }
      }
      
      @keyframes sail-across {
        0% { right: -20%; }
        100% { right: 120%; }
      }

      @keyframes wave-move {
        0% { background-position-x: 0; }
        100% { background-position-x: 1000px; }
      }

      .ship-float {
        animation: float-ship 3s ease-in-out infinite;
      }
      
      .ship-move {
        position: absolute;
        animation: sail-across 3s linear forwards;
      }
      
      .wave-anim {
        animation: wave-move 10s linear infinite;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react/": "https://esm.sh/react@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.33.0"
      }
    }
    </script>
  </head>
  <body class="h-full w-full bg-gray-50">
    <div id="root" class="h-full w-full flex items-center justify-center"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
